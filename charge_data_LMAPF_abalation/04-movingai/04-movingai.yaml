results_views:
  agent_throughput:
    type: plot
    x: num_agents
    y: avg_throughput
    width: 3
    height: 2.5
    line_width: 2
    use_log_scale_x: True
    legend_font_size: 8
    font_size: 8
    hue_order: [ChargerAppo(new_obs), ChargerAppo(wo_enc), ChargerAppo(wo_battery), ChargerAppo(wo_penalty)] #[ Follower , FollowerLite]
    name: MovingAI
    ticks: [128, 256]
  episode_throughput:
