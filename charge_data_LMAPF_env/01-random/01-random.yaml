results_views:
  agent_throughput:
    type: plot
    x: num_agents
    y: avg_throughput
    width: 5
    height: 4
    line_width: 2
    use_log_scale_x: True
    legend_font_size: 8
    font_size: 8
    hue_order: [RHCR, DCC, SCRIMP, Follower, VDN, QMIX] #[ Follower , FollowerLite]
    name: Random
    ticks: [8, 16, 24, 32, 48, 64]
  episode_throughput:
    type: plot
    x: max_episode_steps
    y: avg_throughput
    width: 3
    height: 2.5
    line_width: 2
    use_log_scale_x: True
    legend_font_size: 8
    font_size: 8
    hue_order: [RHCR, DCC, SCRIMP, Follower, VDN, QMIX]
    name: Random
    ticks: [64, 128, 256, 512]
  agents_depletion_rate:
    type: plot
    x: max_episode_steps
    y: agents_depletion_rate
    width: 3
    height: 2.5
    line_width: 2
    use_log_scale_x: True
    legend_font_size: 8
    font_size: 8
    hue_order: [RHCR, DCC, SCRIMP, Follower, VDN, QMIX]
    name: Random
    ticks: [64, 128, 256, 512]
  valid_episode_relative:
    type: plot
    x: max_episode_steps
    y: valid_episode_relative
    width: 5
    height: 4
    line_width: 2
    use_log_scale_x: True
    legend_font_size: 8
    font_size: 8
    hue_order: [RHCR, DCC, SCRIMP, Follower]
    name: Random
    ticks: [64, 128, 256, 512]
  runtime:
    type: plot
    x: num_agents
    y: runtime
    width: 3
    height: 2.5
    line_width: 2
    use_log_scale_x: True
    legend_font_size: 8
    font_size: 8
    hue_order: [RHCR, DCC, SCRIMP, Follower, VDN, QMIX]
    name: Random
    ticks: [8, 16, 24, 32, 48, 64]
TabularView1:
  drop_keys: [seed, map_name]
  print_results: true
